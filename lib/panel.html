<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章</title>
<style>
:root{
  --paper:#F4F2EB; --ink:#1A1A17; --line:#DAD5C7; --muted:#7A766B;
  --blue:#24427E; --blue-soft:#E8EBF3; --red:#B3372A; --ok:#2E6B4E;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SFMono-Regular",monospace;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC",serif;
  --sans:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.55 var(--sans);background:var(--paper);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
::selection{background:var(--blue);color:#fff}

/* header */
.top{display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px solid var(--line);flex:none;background:var(--paper);position:relative;z-index:3}
.mark{width:20px;height:20px;flex:none;display:grid;place-items:center;background:var(--ink);color:var(--paper);font:600 11px/1 var(--serif)}
.top .t{font:600 13.5px/1.3 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{border:1px solid transparent;background:transparent;color:var(--muted);padding:3px 7px;font-size:11.5px;border-radius:2px}
.ghost:hover{color:var(--ink);border-color:var(--line);background:#fff}
.back{border:0;background:transparent;color:var(--muted);padding:2px 0;font-size:12px}
.back:hover{color:var(--ink)}
.primary{background:var(--ink);color:var(--paper);border:1px solid var(--ink);padding:6px 13px;border-radius:2px;font-weight:600}
.primary:hover{background:var(--blue);border-color:var(--blue)}
button[disabled]{opacity:.4;cursor:not-allowed}

/* list */
.compose{display:flex;gap:10px;align-items:flex-end;padding:14px 14px 8px;flex:none}
.compose input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--line);padding:5px 1px;font:14px var(--serif);color:var(--ink);outline:none}
.compose input::placeholder{color:#B3AC9C}
.compose input:focus{border-bottom-color:var(--blue)}
.toolbar{display:flex;align-items:center;gap:8px;padding:0 14px 10px;flex-wrap:wrap;font:10.5px var(--mono);letter-spacing:.06em;color:var(--muted)}
.toolbar .sp{flex:1}
.toolbar .link{border:0;background:transparent;color:var(--muted);font:10.5px var(--mono);letter-spacing:.06em;padding:2px 0}
.toolbar .link:hover{color:var(--ink)}
.toolbar .inline-input{flex:1;min-width:120px;background:transparent;border:0;border-bottom:1px solid var(--line);padding:3px 2px;font:12px var(--sans);color:var(--ink);outline:none}
.toolbar .mini{padding:3px 9px;font-size:11px}
.rows{flex:1;overflow:auto;padding:2px 6px 18px}
.empty{padding:44px 20px;text-align:center;color:var(--muted);font:12px var(--mono);letter-spacing:.04em;line-height:1.9}

.group-title{display:flex;align-items:center;gap:8px;margin:16px 8px 3px;padding-bottom:5px;border-bottom:1px solid var(--line);
  font:10px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-radius:1px}
.group-title:hover{color:var(--ink)}
.group-title.drop{color:var(--blue);border-bottom-color:var(--blue);background:var(--blue-soft)}
.gtitle .gops{margin-left:auto;display:flex;gap:4px;opacity:0;transition:opacity .12s}
.gtitle:hover .gops{opacity:1}
.gbtn{border:1px solid var(--line);background:#fff;border-radius:1px;font:10px var(--mono);letter-spacing:.06em;padding:1px 6px;color:var(--muted)}
.gbtn:hover{color:var(--ink);border-color:var(--ink)}
.gbtn.danger{color:var(--red);border-color:#E4C3BC}
.ginput{flex:1;min-width:120px;border:1px solid var(--blue);background:#fff;padding:3px 7px;font:12px var(--sans);outline:none}

.row{display:flex;gap:12px;align-items:center;padding:9px 8px;cursor:grab;border-bottom:1px solid rgba(218,213,199,.55);border-radius:1px}
.row:hover{background:#EDEAE0}
.row[draggable]{cursor:grab}
.row.dragging{opacity:.4}
.row.drop{background:var(--blue-soft)}
.thumb{width:52px;height:68px;flex:none;border:1px solid var(--line);background:#fff;overflow:hidden;position:relative;display:grid;place-items:center;font:8.5px var(--mono);letter-spacing:.08em;color:#B0A996}
.thumb img{width:100%;height:100%;object-fit:contain;display:block;background:#fff;padding:2px}
.thumb.empty-thumb{background:repeating-linear-gradient(135deg,#F4F2EB,#F4F2EB 6px,#EDEAE0 6px,#EDEAE0 12px)}
.rmain{flex:1;min-width:0}
.rt{font:600 14px/1.35 var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm{font:10px var(--mono);letter-spacing:.05em;color:var(--muted);display:flex;gap:12px;margin-top:5px}

/* detail ticket */
.detail{flex:1;min-height:0;display:flex;flex-direction:column}
.ticket{padding:12px 14px 12px;border-bottom:1px solid var(--line);flex:none;background:var(--paper)}
.ticket-body{display:flex;gap:14px}
.ticket-fields{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 14px}
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.fld-wide{grid-column:1 / -1}
.fld span{font:9px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select{background:transparent;border:0;border-bottom:1px solid var(--line);padding:3px 0;font:12.5px var(--sans);color:var(--ink);outline:none;width:100%;min-width:0;max-width:100%}
@media (max-width:520px){
  .ticket-fields{grid-template-columns:minmax(0,1fr)}
  .cover-card{width:64px}
  .cover-card img,.cover-card .no-cover{width:64px;height:86px}
}
.fld input:focus,.fld select:focus{border-bottom-color:var(--blue)}
.fld select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 9px) 55%,calc(100% - 5px) 55%;background-size:4px 4px;background-repeat:no-repeat;padding-right:16px}
.cover-card{width:78px;flex:none;display:flex;flex-direction:column;gap:4px}
.cover-card img{width:78px;height:104px;object-fit:contain;border:1px solid var(--line);background:#fff;display:none;padding:2px}
.cover-card span{font:9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cover-card .no-cover{width:78px;height:104px;border:1px dashed var(--line);display:none;place-items:center;font:8.5px var(--mono);color:#B0A996}
.source-row{display:flex;gap:8px;margin-top:12px}
.source-row input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--line);padding:4px 1px;font:11.5px var(--sans);color:var(--ink);outline:none}
.source-row input::placeholder{color:#B4AD9D}
.source-row input:focus{border-bottom-color:var(--blue)}
.paste-box{display:none;flex-direction:column;gap:6px;margin-top:8px}
.paste-box.on{display:flex}
.paste-box textarea{width:100%;height:96px;resize:vertical;background:#fff;border:1px solid var(--line);padding:6px;font:11px var(--mono);color:var(--ink);outline:none}
.paste-box textarea:focus{border-color:var(--blue)}
.sources{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.src-item{font:10px var(--mono);color:var(--muted);letter-spacing:.02em;display:flex;gap:6px}
.src-item b{font-weight:500;color:var(--ink);font-family:var(--sans);font-size:11px}
.state{font:10px var(--mono);letter-spacing:.04em;color:var(--muted);margin:10px 0 9px;min-height:14px}
.publish{width:100%;padding:10px;background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:1px;font:600 13px var(--sans);letter-spacing:.04em}
.publish:hover{background:var(--red);border-color:var(--red)}

/* proof sheet */
.sheet-wrap{flex:1;min-height:0;padding:14px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;
  background:linear-gradient(0deg,transparent 23px,rgba(36,66,126,.055) 24px) 0 0/100% 24px,
             linear-gradient(90deg,transparent 23px,rgba(36,66,126,.055) 24px) 0 0/24px 100%}
.sheet{position:relative;width:415px;max-width:100%;flex:1;min-height:0;background:#fff;border:1px solid var(--line);
  box-shadow:0 12px 34px rgba(26,26,23,.10);animation:settle .22s ease-out}
.sheet iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.cm{position:absolute;width:11px;height:11px;border-color:var(--blue);border-style:solid;opacity:.55;pointer-events:none}
.cm.tl{left:-1px;top:-1px;border-width:1px 0 0 1px}
.cm.tr{right:-1px;top:-1px;border-width:1px 1px 0 0}
.cm.bl{left:-1px;bottom:-1px;border-width:0 0 1px 1px}
.cm.br{right:-1px;bottom:-1px;border-width:0 1px 1px 0}
.sheet-note{font:9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
@keyframes settle{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}

/* settings */
.settings{flex:1;min-height:0;overflow:auto;padding:14px;display:none;flex-direction:column;gap:18px}
.settings.on{display:flex}
.panel-section{display:flex;flex-direction:column;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.panel-section h3{margin:0;font:10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font:9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{background:transparent;border:0;border-bottom:1px solid var(--line);padding:4px 0;font:12.5px var(--sans);color:var(--ink);outline:none}
.field input:focus,.field select:focus{border-bottom-color:var(--blue)}
.field .note{font:10px var(--mono);color:var(--muted);letter-spacing:.02em}
.settings .actions{display:flex;gap:8px}
#settingsPath{white-space:pre-line;font:10px var(--mono);color:var(--muted);letter-spacing:.02em}

/* toast */
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,6px);background:var(--ink);color:var(--paper);
  padding:7px 14px;border-radius:1px;font:11.5px var(--sans);letter-spacing:.02em;opacity:0;transition:.16s;pointer-events:none;z-index:50;max-width:92%}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header class="top">
  <button id="back" class="back" style="display:none">‹ 全部</button>
  <span class="mark">文</span>
  <span class="t" id="title">文章</span>
  <span class="sp"></span>
  <button id="refresh" class="ghost">刷新</button>
  <button id="settingsBtn" class="ghost">设置</button>
</header>

<div class="compose" id="newbar">
  <input id="newtitle" placeholder="新文章标题">
  <button id="create" class="primary">新建</button>
</div>

<div class="toolbar" id="groupbar">
  <button id="groupAll" class="link" style="display:none">‹ 全部</button>
  <span class="scope" id="groupScope"></span>
  <span class="sp"></span>
  <input id="newGroupName" class="inline-input" placeholder="新分组名" style="display:none">
  <button id="saveGroup" class="mini primary" style="display:none">创建</button>
  <button id="newGroupBtn" class="link">＋ 分组</button>
</div>

<div class="rows" id="rows"></div>

<div class="detail" id="detail" style="display:none">
  <div class="ticket">
    <div class="ticket-body">
      <div class="ticket-fields">
        <label class="fld fld-wide"><span>题目</span><input id="fTitle" placeholder="文章标题"></label>
        <label class="fld"><span>主题</span><select id="theme" title="选中即生效"></select></label>
        <label class="fld"><span>作者</span><input id="fAuthor" list="authorList" placeholder="署名"><datalist id="authorList"></datalist></label>
        <label class="fld"><span>分组</span><input id="fGroup" list="groupList" placeholder="未分组"><datalist id="groupList"></datalist></label>
        <label class="fld"><span>封面</span><select id="fCover"></select></label>
      </div>
      <div class="cover-card">
        <img id="coverThumb" alt="当前封面">
        <div class="no-cover" id="noCover">无封面</div>
        <span>封面</span>
      </div>
    </div>
    <div class="source-row">
      <input id="searchQuery" placeholder="搜索资料：公司名 / 关键词">
      <button id="searchSources" class="mini">搜索</button>
    </div>
    <div class="sources" id="searchResults"></div>
    <div class="source-row">
      <input id="sourceUrl" placeholder="粘贴公众号文章链接 mp.weixin.qq.com/s/…（导入正文和图片）">
      <button id="importSource" class="mini primary">导入</button>
      <button id="pasteToggle" class="link">粘贴导入</button>
      <button id="fillImages" class="link">补齐配图</button>
    </div>
    <div class="paste-box" id="pasteBox">
      <textarea id="pasteHtml" placeholder="在浏览器里打开文章，Ctrl+A 全选复制后粘贴到这里；也可以直接粘贴网页源码。微信对非客户端请求返回空壳，链接抓不到时用这个。"></textarea>
      <button id="importPaste" class="mini primary">解析导入</button>
    </div>
    <div class="sources" id="sourceList"></div>
    <div class="state" id="state"></div>
    <button id="publish" class="publish">推送草稿 →</button>
  </div>
  <div class="sheet-wrap">
    <div class="sheet">
      <i class="cm tl"></i><i class="cm tr"></i><i class="cm bl"></i><i class="cm br"></i>
      <iframe id="preview" title="preview"></iframe>
    </div>
    <div class="sheet-note">校样 · 415px<span id="sheetTheme"></span></div>
  </div>
</div>

<div class="settings" id="settingsView">
  <div class="panel-section">
    <h3>存储</h3>
    <div class="field">
      <label>文章保存目录</label>
      <input id="setRoot" placeholder="D:\\others\\article\\studio">
      <span class="note">每篇文章一个子目录：draft.md · images/ · out/</span>
    </div>
    <div class="field">
      <label>最少配图张数</label>
      <input id="setMinImages" type="number" min="0" step="1">
      <span class="note">少于该值，排版会被拦下</span>
    </div>
    <div class="field">
      <label>默认主题</label>
      <select id="setTheme"></select>
    </div>
  </div>
  <div class="panel-section">
    <h3>公众号</h3>
    <div class="field">
      <label>AppID</label>
      <input id="setAppId" placeholder="wx…">
    </div>
    <div class="field">
      <label>AppSecret</label>
      <input id="setAppSecret" placeholder="已保存则显示 ******">
      <span class="note">写入 vendor/xiaohu/config.json（已 gitignore）；需在公众号后台把出口 IP 加入白名单</span>
    </div>
    <div class="field">
      <label>作者署名</label>
      <input id="setAuthor" placeholder="留空则用公众号默认">
    </div>
    <div class="hint" id="settingsPath"></div>
  </div>
  <div class="panel-section">
    <h3>配图校验（可选）</h3>
    <div class="field">
      <label>视觉接口 Base URL</label>
      <input id="setVisionBase" placeholder="https://api.openai.com/v1">
      <span class="note">任意 OpenAI 兼容端点；留空则只做元数据指纹检查</span>
    </div>
    <div class="field">
      <label>模型</label>
      <input id="setVisionModel" placeholder="如 gpt-4o-mini / qwen-vl-plus">
    </div>
    <div class="field">
      <label>API Key</label>
      <input id="setVisionKey" placeholder="已保存则显示 ******">
    </div>
  </div>
  <div class="actions">
    <button id="saveSettings" class="primary">保存设置</button>
    <button id="closeSettings" class="ghost">返回</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
let THEMES = [];
const $ = (id) => document.getElementById(id);
let current = null, busy = false, tick = 0;
let groups = [];
let viewGroup = null;

async function loadThemes(){
  const r = await rpc({ action: "themes" });
  THEMES = (r && r.ok && r.themes) || [];
  renderThemes();
}
async function checkHost(){
  const cap = await rpc({ action: "capabilities" });
  if (!cap || !cap.ok || (cap.actions || []).indexOf("theme") < 0) {
    $("state").style.color = "#c4402b";
    $("state").textContent = "宿主仍是旧版本：请完全退出 DSH 后重新打开（当前进程没有加载新动作）";
    return false;
  }
  return true;
}

function toast(text){
  const t = $("toast");
  t.textContent = text;
  t.classList.add("on");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("on"), 2200);
}
async function rpc(body){
  try {
    const res = await fetch("/dsh-article-studio/rpc", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body)
    });
    return await res.json();
  } catch (error) {
    return { ok: false, error: String(error && error.message || error) };
  }
}
function setBusy(v){
  busy = v;
  ["publish","create","theme","fTitle","fAuthor","fGroup","fCover","importSource","sourceUrl"].forEach((id) => {
    const node = $(id);
    if (node) node.disabled = v;
  });
}
function previewUrl(){ return "/dsh-article-studio/preview/" + encodeURIComponent(current.id) + "?t=" + (++tick); }

function renderThemes(){
  const sel = $("theme");
  sel.innerHTML = "";
  if (!THEMES.length) {
    const o = document.createElement("option");
    o.value = ""; o.textContent = "（主题列表未加载）";
    sel.appendChild(o);
    return;
  }
  THEMES.forEach((theme) => {
    const o = document.createElement("option");
    o.value = theme.id;
    o.textContent = theme.name && theme.name !== theme.id ? theme.name + " · " + theme.id : theme.id;
    sel.appendChild(o);
  });
  if (current && current.theme) sel.value = current.theme;
}
function moveArticle(id, group){
  return rpc({ action: "update", id: id, group: group }).then(function (r) {
    toast(r && r.ok ? "已移动到 " + (group || "未分组") : "移动失败：" + ((r && r.error) || ""));
    if (r && r.ok) loadList();
  });
}

function assetUrl(id, rel){
  return "/dsh-article-studio/asset/" + encodeURIComponent(id) + "/" + String(rel).split("/").map(encodeURIComponent).join("/");
}

function makeRow(a){
  const row = document.createElement("div");
  row.className = "row";
  row.draggable = true;
  row.innerHTML = '<div class="thumb"></div><div class="rmain"><div class="rt"></div><div class="rm"><span></span><span></span></div></div>';
  const thumb = row.querySelector(".thumb");
  if (a.cover) {
    const img = document.createElement("img");
    img.src = assetUrl(a.id, a.cover);
    img.alt = "封面";
    thumb.appendChild(img);
  } else {
    thumb.textContent = "无封面";
    thumb.classList.add("empty-thumb");
  }
  row.querySelector(".rt").textContent = a.title || a.id;
  row.querySelectorAll(".rm span")[0].textContent = String(a.updatedAt || "").replace("T", " ");
  row.querySelectorAll(".rm span")[1].textContent = "第 " + (a.draftVersion || 0) + " 稿" + (a.author ? " · " + a.author : "");
  row.onclick = () => openArticle(a.id);
  row.addEventListener("dragstart", (e) => {
    row.classList.add("dragging");
    e.dataTransfer.setData("text/plain", a.id);
    e.dataTransfer.effectAllowed = "move";
  });
  row.addEventListener("dragend", () => row.classList.remove("dragging"));
  return row;
}

function startRename(title, name){
  title.innerHTML = "";
  title.onclick = null;
  const input = document.createElement("input");
  input.className = "ginput";
  input.value = name;
  const save = document.createElement("button");
  save.className = "gbtn";
  save.textContent = "保存";
  const cancel = document.createElement("button");
  cancel.className = "gbtn";
  cancel.textContent = "取消";
  title.append(input, save, cancel);
  input.onclick = (e) => e.stopPropagation();
  input.focus();
  input.select();
  const finish = async (commit) => {
    if (!commit) { loadList(); return; }
    const next = input.value.trim();
    if (!next || next === name) { loadList(); return; }
    const r = await rpc({ action: "renameGroup", from: name, to: next });
    toast(r && r.ok ? "已改名为：" + next : "改名失败：" + ((r && r.error) || ""));
    if (viewGroup === name) viewGroup = next;
    loadList();
  };
  save.onclick = (e) => { e.stopPropagation(); finish(true); };
  cancel.onclick = (e) => { e.stopPropagation(); finish(false); };
  input.onkeydown = (e) => {
    e.stopPropagation();
    if (e.key === "Enter") finish(true);
    if (e.key === "Escape") finish(false);
  };
}

function startDelete(title, name, count){
  title.innerHTML = "";
  title.onclick = null;
  const text = document.createElement("span");
  text.textContent = "删除「" + name + "」？" + (count ? "其中 " + count + " 篇移回未分组" : "该分组为空");
  const yes = document.createElement("button");
  yes.className = "gbtn danger";
  yes.textContent = "删除";
  const no = document.createElement("button");
  no.className = "gbtn";
  no.textContent = "取消";
  yes.onclick = async (e) => {
    e.stopPropagation();
    const r = await rpc({ action: "deleteGroup", name });
    toast(r && r.ok ? "已删除分组：" + name : "删除失败：" + ((r && r.error) || ""));
    if (viewGroup === name) viewGroup = null;
    loadList();
  };
  no.onclick = (e) => { e.stopPropagation(); loadList(); };
  title.append(text, yes, no);
}

function dropTarget(node, group){
  node.addEventListener("dragover", (e) => { e.preventDefault(); node.classList.add("drop"); e.dataTransfer.dropEffect = "move"; });
  node.addEventListener("dragleave", () => node.classList.remove("drop"));
  node.addEventListener("drop", (e) => {
    e.preventDefault();
    node.classList.remove("drop");
    const id = e.dataTransfer.getData("text/plain");
    if (id) moveArticle(id, group);
  });
}

function renderRows(list){
  const box = $("rows");
  box.innerHTML = "";
  $("groupAll").style.display = viewGroup === null ? "none" : "";
  $("groupScope").textContent = viewGroup === null ? "" : "分组：" + (viewGroup || "未分组");
  const inView = list.filter((a) => viewGroup === null || String(a.group || "").trim() === viewGroup);
  if (!inView.length) {
    box.innerHTML = '<div class="empty">' + (viewGroup === null ? "还没有文章，先在上面新建一篇。" : "这个分组还没有文章，可在上方新建。") + "</div>";
    return;
  }
  if (viewGroup !== null) {
    inView.forEach((a) => box.appendChild(makeRow(a)));
    return;
  }
  const buckets = new Map();
  groups.forEach((name) => buckets.set(name, []));
  inView.forEach((a) => {
    const key = String(a.group || "").trim() || "未分组";
    if (!buckets.has(key)) buckets.set(key, []);
    buckets.get(key).push(a);
  });
  [...buckets.keys()].sort((left, right) => (left === "未分组" ? 1 : right === "未分组" ? -1 : left.localeCompare(right))).forEach((name) => {
    const title = document.createElement("div");
    title.className = "group-title gtitle";
    const label = document.createElement("span");
    label.textContent = name + " · " + buckets.get(name).length + " 篇";
    title.appendChild(label);
    if (name !== "未分组") {
      const ops = document.createElement("span");
      ops.className = "gops";
      const rename = document.createElement("button");
      rename.className = "gbtn";
      rename.textContent = "改名";
      rename.onclick = (e) => { e.stopPropagation(); startRename(title, name); };
      const del = document.createElement("button");
      del.className = "gbtn danger";
      del.textContent = "删除";
      del.onclick = (e) => { e.stopPropagation(); startDelete(title, name, buckets.get(name).length); };
      ops.append(rename, del);
      title.appendChild(ops);
    }
    title.onclick = () => { viewGroup = name === "未分组" ? "" : name; renderRows(list); };
    dropTarget(title, name === "未分组" ? "" : name);
    box.appendChild(title);
    buckets.get(name).forEach((a) => box.appendChild(makeRow(a)));
  });
}
async function loadList(){
  const r = await rpc({ action: "list" });
  if (!r || !r.ok) { toast("读取失败：" + ((r && r.error) || "")); return; }
  groups = r.groups || [];
  renderRows(r.articles || []);
}
async function openArticle(id){
  // Drop the previous article's state first: a slow load must never leave the
  // old title, theme or proof on screen while another article is opening.
  current = null;
  $("title").textContent = "加载中…";
  $("state").textContent = "";
  $("detail").style.display = "flex";
  $("preview").removeAttribute("src");
  $("settingsView").classList.remove("on");
  $("newbar").style.display = "none";
  $("groupbar").style.display = "none";
  $("rows").style.display = "none";
  $("back").style.display = "";
  const r = await rpc({ action: "get", id: id });
  if (!r || !r.ok) { toast("打开失败：" + ((r && r.error) || "")); $("title").textContent = "打开失败"; return; }
  current = r.article;
  current.images = r.images || [];
  const title = current.title || current.id;
  $("title").textContent = title === current.id ? title : title + " · " + current.id;
  renderThemes();
  renderMetaFields(r);
  renderSources(current.sources || []);
  $("preview").src = previewUrl();
  updateState();
}

function renderSources(list){
  const box = $("sourceList");
  box.innerHTML = "";
  (list || []).slice(0, 4).forEach((item) => {
    const row = document.createElement("div");
    row.className = "src-item";
    const name = document.createElement("b");
    name.textContent = item.title || item.url;
    const meta = document.createElement("span");
    meta.textContent = (item.images || 0) + " 图 · " + (item.chars || 0) + " 字";
    row.append(name, meta);
    box.appendChild(row);
  });
}

function renderMetaFields(r){
  $("fTitle").value = current.title || "";
  $("fAuthor").value = current.author || "";
  $("fGroup").value = current.group || "";
  $("authorList").innerHTML = (r.authors || []).map((name) => '<option value="' + name + '">').join("");
  $("groupList").innerHTML = (r.groups || []).map((name) => '<option value="' + name + '">').join("");
  const options = ['<option value="">不设封面</option>'].concat((current.images || []).map((image) => {
    const value = "images/" + image.name;
    return '<option value="' + value + '">' + image.name + "</option>";
  }));
  $("fCover").innerHTML = options.join("");
  $("fCover").value = current.cover || "";
  syncCoverThumb();
}

function syncCoverThumb(){
  const thumb = $("coverThumb");
  const empty = $("noCover");
  const hasCover = !!(current && current.cover);
  if (hasCover) {
    thumb.src = assetUrl(current.id, current.cover);
    thumb.style.display = "block";
    if (empty) empty.style.display = "none";
  } else {
    thumb.removeAttribute("src");
    thumb.style.display = "none";
    if (empty) empty.style.display = "grid";
  }
}

function updateState(images){
  if (!current) return;
  const list = images || current.images || [];
  const count = list.length;
  const cover = current.cover ? "封面 ✓" : "未设封面";
  const author = current.author ? "作者 " + current.author : "未署名";
  const group = current.group ? "分组 " + current.group : "未分组";
  $("state").textContent = "第 " + (current.draftVersion || 0) + " 稿 · " + (current.theme || "") + " · 配图 " + count + " 张 · " + cover + " · " + author + " · " + group + (count < 3 ? "（不足 3 张，排版会被拦下）" : "");
  if ($("sheetTheme")) $("sheetTheme").textContent = " · " + (current.theme || "");
}

async function saveMeta(field, value){
  if (!current || busy) return;
  setBusy(true);
  try {
    const r = await rpc({ action: "update", id: current.id, [field]: value });
    if (!r || !r.ok) { toast("保存失败：" + ((r && r.error) || "")); return; }
    current = Object.assign(current, r.article);
    const title = current.title || current.id;
    $("title").textContent = title === current.id ? title : title + " · " + current.id;
    updateState();
    syncCoverThumb();
    loadList();
  } finally {
    setBusy(false);
  }
}
function showList(){
  current = null;
  // Returning from an article always lands on the full list; the group filter is
  // re-entered by clicking a group header.
  viewGroup = null;
  $("settingsView").classList.remove("on");
  $("detail").style.display = "none";
  $("newbar").style.display = "";
  $("groupbar").style.display = "";
  $("rows").style.display = "";
  $("back").style.display = "none";
  $("title").textContent = "文章";
  loadList();
}
async function applyTheme(name){
  if (!current || busy) return;
  setBusy(true);
  try {
    const t = await rpc({ action: "theme", id: current.id, theme: name });
    if (!t || !t.ok) { toast("切换失败：" + ((t && t.error) || "")); return; }
    current.theme = name;
    renderThemes();
    updateState();
    const f = await rpc({ action: "format", id: current.id, theme: name });
    if (!f || !f.ok) { toast("排版失败：" + ((f && f.error) || "")); return; }
    $("preview").src = previewUrl();
    updateState();
    const missing = (f.warnings || []);
    toast(missing.length ? "已切换，但缺配图：" + missing.join("、") : "已切换风格：" + name);
  } finally {
    setBusy(false);
  }
}
async function runAction(body, okText){
  if (!current || busy) return;
  setBusy(true);
  try {
    const r = await rpc(body);
    const missing = (r && r.warnings) || [];
    toast(r && r.ok ? (missing.length ? okText + "，但缺配图：" + missing.join("、") : okText) : "失败：" + ((r && r.error) || "未知错误"));
    if (r && r.ok && body.action === "format") $("preview").src = previewUrl();
  } finally {
    setBusy(false);
  }
}
$("fTitle").onchange = () => saveMeta("title", $("fTitle").value.trim());
$("fAuthor").onchange = () => saveMeta("author", $("fAuthor").value.trim());
$("fGroup").onchange = () => saveMeta("group", $("fGroup").value.trim());
$("fCover").onchange = () => saveMeta("cover", $("fCover").value);
$("publish").onclick = () => runAction({ action: "publish", id: current.id }, "已推送草稿箱");
$("searchSources").onclick = async () => {
  if (busy) return;
  const query = $("searchQuery").value.trim();
  if (!query) { toast("先输入关键词"); return; }
  setBusy(true);
  try {
    const r = await rpc({ action: "searchSources", query });
    if (!r || !r.ok) { toast("搜索失败：" + ((r && r.error) || "")); return; }
    const box = $("searchResults");
    box.innerHTML = "";
    (r.items || []).forEach((item) => {
      const row = document.createElement("div");
      row.className = "src-item";
      const name = document.createElement("b");
      name.textContent = item.title;
      name.style.cursor = "pointer";
      name.onclick = () => { $("sourceUrl").value = item.url; toast("已填入链接，点「导入」抓正文和图片"); };
      const host = document.createElement("span");
      try { host.textContent = new URL(item.url).hostname.replace(/^www\./, ""); } catch { host.textContent = ""; }
      row.append(name, host);
      box.appendChild(row);
    });
    if (!(r.items || []).length) box.textContent = "没有结果";
    toast("找到 " + (r.items || []).length + " 条，点标题填入链接");
  } finally {
    setBusy(false);
  }
};
$("fillImages").onclick = async () => {
  if (!current || busy) return;
  setBusy(true);
  try {
    const r = await rpc({ action: "fillImages", id: current.id });
    if (!r || !r.ok) { toast("补齐失败：" + ((r && r.error) || "")); return; }
    toast("已补齐 " + r.added + " 张配图");
    await openArticle(current.id);
  } finally {
    setBusy(false);
  }
};
$("pasteToggle").onclick = () => $("pasteBox").classList.toggle("on");
$("importPaste").onclick = async () => {
  if (!current || busy) return;
  const html = $("pasteHtml").value.trim();
  if (html.length < 40) { toast("先粘贴正文或网页源码"); return; }
  setBusy(true);
  try {
    const r = await rpc({ action: "importSource", id: current.id, html });
    if (!r || !r.ok) { toast("解析失败：" + ((r && r.error) || "")); return; }
    toast("已导入《" + r.title + "》· " + r.chars + " 字 · " + (r.images || []).length + " 图");
    $("pasteHtml").value = "";
    $("pasteBox").classList.remove("on");
    await openArticle(current.id);
  } finally {
    setBusy(false);
  }
};
$("importSource").onclick = async () => {
  if (!current || busy) return;
  const url = $("sourceUrl").value.trim();
  if (!url) { toast("先粘贴文章链接"); return; }
  setBusy(true);
  try {
    const r = await rpc({ action: "importSource", id: current.id, url });
    if (!r || !r.ok) { toast("导入失败：" + ((r && r.error) || "")); return; }
    toast("已导入《" + r.title + "》· " + r.chars + " 字 · " + (r.images || []).length + " 图");
    $("sourceUrl").value = "";
    await openArticle(current.id);
  } finally {
    setBusy(false);
  }
};
$("back").onclick = showList;
$("refresh").onclick = () => { if (current) openArticle(current.id); else loadList(); };
$("create").onclick = async () => {
  const title = $("newtitle").value.trim();
  if (!title) { toast("先写个标题"); return; }
  setBusy(true);
  try {
    const body = { action: "create", title };
    if (viewGroup !== null) body.group = viewGroup;
    const r = await rpc(body);
    if (r && r.ok) {
      $("newtitle").value = "";
      toast("已新建：" + title + (viewGroup ? "（" + (viewGroup || "未分组") + "）" : ""));
      await loadList();
      await openArticle(r.id);
    } else toast("新建失败：" + ((r && r.error) || ""));
  } finally { setBusy(false); }
};
$("newGroupBtn").onclick = () => {
  $("newGroupName").style.display = "";
  $("saveGroup").style.display = "";
  $("newGroupBtn").style.display = "none";
  $("newGroupName").focus();
};
$("saveGroup").onclick = async () => {
  const name = $("newGroupName").value.trim();
  if (!name) { toast("先写分组名"); return; }
  const r = await rpc({ action: "createGroup", name });
  toast(r && r.ok ? "已创建分组：" + name : "创建失败：" + ((r && r.error) || ""));
  if (!r || !r.ok) return;
  $("newGroupName").value = "";
  $("newGroupName").style.display = "none";
  $("saveGroup").style.display = "none";
  $("newGroupBtn").style.display = "";
  viewGroup = name;
  groups = r.groups || groups;
  loadList();
};
$("groupAll").onclick = () => { viewGroup = null; loadList(); };
$("newGroupName").addEventListener("keydown", (e) => { if (e.key === "Enter") $("saveGroup").click(); });
$("settingsBtn").onclick = async () => {
  const r = await rpc({ action: "settings" });
  if (!r || !r.ok) { toast("读取设置失败：" + ((r && r.error) || "")); return; }
  $("setRoot").value = r.root || "";
  $("setMinImages").value = r.minImages === undefined ? 3 : r.minImages;
  $("setTheme").innerHTML = THEMES.map((t) => '<option value="' + t.id + '">' + t.name + " · " + t.id + "</option>").join("");
  $("setTheme").value = r.defaultTheme || "newspaper";
  $("setAppId").value = r.wechat.app_id || "";
  $("setAppSecret").value = r.wechat.app_secret || "";
  $("setAuthor").value = r.wechat.author || "";
  $("setVisionBase").value = (r.vision || {}).baseUrl || "";
  $("setVisionModel").value = (r.vision || {}).model || "";
  $("setVisionKey").value = (r.vision || {}).apiKey || "";
  $("settingsPath").textContent = "设置文件：" + (r.settingsPath || "") + "\n公众号配置：" + (r.configPath || "");
  $("rows").style.display = "none";
  $("newbar").style.display = "none";
  $("groupbar").style.display = "none";
  $("detail").style.display = "none";
  $("settingsView").classList.add("on");
};
$("closeSettings").onclick = () => {
  $("settingsView").classList.remove("on");
  if (current) openArticle(current.id);
  else { $("newbar").style.display = ""; $("groupbar").style.display = ""; $("rows").style.display = ""; loadList(); }
};
$("saveSettings").onclick = async () => {
  const r = await rpc({
    action: "saveSettings",
    root: $("setRoot").value.trim(),
    minImages: Number($("setMinImages").value),
    defaultTheme: $("setTheme").value,
    wechat: {
      app_id: $("setAppId").value.trim(),
      app_secret: $("setAppSecret").value,
      author: $("setAuthor").value.trim()
    },
    vision: {
      baseUrl: $("setVisionBase").value.trim(),
      model: $("setVisionModel").value.trim(),
      apiKey: $("setVisionKey").value
    }
  });
  toast(r && r.ok ? "设置已保存" : "保存失败：" + ((r && r.error) || ""));
  if (r && r.ok) loadList();
};
$("newtitle").addEventListener("keydown", (e) => { if (e.key === "Enter") $("create").click(); });
$("theme").addEventListener("change", (e) => { if (e.target.value) applyTheme(e.target.value); });
const params = new URLSearchParams(location.search);
const deepArticle = params.get("article");
checkHost();
loadThemes().then(() => {
  if (deepArticle) openArticle(deepArticle);
  else if (params.get("view") === "settings") $("settingsBtn").click();
  else loadList();
});
</script>
</body>
</html>
