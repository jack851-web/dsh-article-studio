<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章</title>
<style>
:root{--ink:#171410;--muted:#8b8377;--rule:#e2dbcd;--paper:#faf8f3;--red:#c4402b}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.55 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--rule);flex:none}
header .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sp{flex:1}
button{border:1px solid var(--rule);background:#fff;color:inherit;border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
button:hover{background:#f1ede4}
button.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
button[disabled]{opacity:.45;cursor:not-allowed}
.back{border:0;background:transparent;color:var(--muted);padding:2px 0}
.new{display:flex;gap:6px;padding:4px 12px 10px;flex:none}
.new input{flex:1;min-width:0;padding:6px 8px;border-radius:6px;border:1px solid var(--rule);background:#fff;color:inherit;font:inherit;outline:none}
.rows{flex:1;overflow:auto;padding:2px 8px 12px}
.row{padding:9px 10px;border-radius:8px;cursor:pointer}
.row:hover{background:#f1ede4}
.row .rt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rm{color:var(--muted);font-size:11px;display:flex;gap:8px;margin-top:2px}
.detail{flex:1;min-height:0;display:flex;flex-direction:column}
.controls{padding:8px 12px 6px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid rgba(0,0,0,.06);flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--rule);background:#fff;border-radius:999px;padding:4px 11px;font-size:11px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
select.theme{flex:1;min-width:0;padding:5px 8px;border:1px solid var(--rule);border-radius:6px;background:#fff;color:inherit;font:inherit;outline:none}
.warn{color:var(--red);font-size:11px;padding:4px 12px 8px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.stage{flex:1;min-height:0;display:flex;justify-content:center;padding:10px 12px 12px;background:rgba(128,128,128,.05)}
.phone{width:415px;max-width:100%;height:100%;border:1px solid rgba(0,0,0,.12);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.phone iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.empty{padding:30px 12px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(20,20,20,.9);color:#fff;padding:7px 12px;border-radius:999px;font-size:12px;pointer-events:none;opacity:0;transition:.15s}
.toast.on{opacity:1}
.hint{font-size:11px;color:var(--muted);padding:0 2px}
.settings{flex:1;min-height:0;overflow:auto;padding:12px 14px;display:none;flex-direction:column;gap:10px}
.settings.on{display:flex}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--muted)}
.field input,.field select{padding:6px 8px;border:1px solid var(--rule);border-radius:6px;background:#fff;color:inherit;font:inherit;outline:none}
.field .note{font-size:10.5px;color:var(--muted)}
.settings .actions{margin-top:6px}
#settingsPath{white-space:pre-line}
.fields{display:flex;flex-wrap:wrap;gap:8px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);flex:1 1 150px;min-width:130px}
.fld span{font-size:10.5px}
.fld input,.fld select{padding:5px 7px;border:1px solid var(--rule);border-radius:6px;background:#fff;color:var(--ink);font:inherit;font-size:12px;outline:none}
.fld input:focus,.fld select:focus{border-color:var(--ink)}
.group-title{font-size:11px;color:var(--muted);padding:10px 4px 2px;letter-spacing:.04em;cursor:pointer;border-radius:6px}
.group-title:hover{background:rgba(128,128,128,.08);color:var(--ink)}
.group-title.drop{background:rgba(59,108,246,.14);color:var(--ink)}
.groupbar{display:flex;align-items:center;gap:6px;padding:0 12px 8px;flex-wrap:wrap}
.groupbar .chip{font-size:11px;padding:3px 9px}
.groupbar input{flex:1;min-width:120px;padding:5px 8px;border:1px solid var(--rule);border-radius:6px;background:#fff;color:inherit;font:inherit;font-size:12px;outline:none}
.groupbar .scope{font-size:11px;color:var(--muted)}
.row[draggable]{cursor:grab}
.row.dragging{opacity:.45}
.row.drop{background:rgba(59,108,246,.1)}
</style>
</head>
<body>
<header>
  <button id="back" class="back" style="display:none">‹ 全部</button>
  <span class="t" id="title">文章</span>
  <span class="sp"></span>
  <button id="settingsBtn">设置</button>
  <button id="refresh">刷新</button>
</header>
<div class="new" id="newbar">
  <input id="newtitle" placeholder="新文章标题">
  <button id="create" class="primary">新建</button>
</div>
<div class="groupbar" id="groupbar">
  <button id="groupAll" class="chip" style="display:none">‹ 全部</button>
  <span class="scope" id="groupScope"></span>
  <input id="newGroupName" placeholder="新分组名" style="display:none">
  <button id="newGroupBtn" class="chip">＋ 新建分组</button>
  <button id="saveGroup" class="primary" style="display:none">创建</button>
</div>
<div class="rows" id="rows"></div>
<div class="detail" id="detail" style="display:none">
  <div class="controls">
    <div class="fields">
      <label class="fld"><span>主题</span><select id="theme" title="选中即生效"></select></label>
      <label class="fld"><span>题目</span><input id="fTitle" placeholder="文章标题"></label>
      <label class="fld"><span>作者</span><input id="fAuthor" list="authorList" placeholder="署名"><datalist id="authorList"></datalist></label>
      <label class="fld"><span>分组</span><input id="fGroup" list="groupList" placeholder="如：具身智能"><datalist id="groupList"></datalist></label>
      <label class="fld"><span>封面</span><select id="fCover"></select></label>
    </div>
    <div class="actions"><button id="publish" class="primary">推送草稿</button></div>
    <div class="hint" id="state"></div>
  </div>
  <div class="stage"><div class="phone"><iframe id="preview" title="preview"></iframe></div></div>
</div>
<div class="settings" id="settingsView">
  <div class="field">
    <label>文章保存目录</label>
    <input id="setRoot" placeholder="D:\\others\\article\\studio">
    <span class="note">每篇文章一个子目录，内含 draft.md、images/ 与 out/</span>
  </div>
  <div class="field">
    <label>最少配图张数（少于该值排版会被拦下）</label>
    <input id="setMinImages" type="number" min="0" step="1">
  </div>
  <div class="field">
    <label>默认主题</label>
    <select id="setTheme"></select>
  </div>
  <div class="field">
    <label>公众号 AppID</label>
    <input id="setAppId" placeholder="wx…">
  </div>
  <div class="field">
    <label>公众号 AppSecret</label>
    <input id="setAppSecret" placeholder="已保存则显示 ******">
    <span class="note">凭据写入 vendor/xiaohu/config.json（已被 .gitignore 排除），并需要在公众号后台把出口 IP 加入白名单</span>
  </div>
  <div class="field">
    <label>作者署名</label>
    <input id="setAuthor" placeholder="留空则用公众号默认">
  </div>
  <div class="actions">
    <button id="saveSettings" class="primary">保存设置</button>
    <button id="closeSettings">返回</button>
  </div>
  <div class="hint" id="settingsPath"></div>
</div>
<div class="toast" id="toast"></div>
<script>
let THEMES = [];
const $ = (id) => document.getElementById(id);
let current = null, busy = false, tick = 0;
let groups = [];
let viewGroup = null;

async function loadThemes(){
  const r = await rpc({ action: "themes" });
  THEMES = (r && r.ok && r.themes) || [];
  renderThemes();
}
async function checkHost(){
  const cap = await rpc({ action: "capabilities" });
  if (!cap || !cap.ok || (cap.actions || []).indexOf("theme") < 0) {
    $("state").style.color = "#c4402b";
    $("state").textContent = "宿主仍是旧版本：请完全退出 DSH 后重新打开（当前进程没有加载新动作）";
    return false;
  }
  return true;
}

function toast(text){
  const t = $("toast");
  t.textContent = text;
  t.classList.add("on");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("on"), 2200);
}
async function rpc(body){
  try {
    const res = await fetch("/dsh-article-studio/rpc", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body)
    });
    return await res.json();
  } catch (error) {
    return { ok: false, error: String(error && error.message || error) };
  }
}
function setBusy(v){
  busy = v;
  ["publish","create","theme","fTitle","fAuthor","fGroup","fCover"].forEach((id) => {
    const node = $(id);
    if (node) node.disabled = v;
  });
}
function previewUrl(){ return "/dsh-article-studio/preview/" + encodeURIComponent(current.id) + "?t=" + (++tick); }

function renderThemes(){
  const sel = $("theme");
  sel.innerHTML = "";
  if (!THEMES.length) {
    const o = document.createElement("option");
    o.value = ""; o.textContent = "（主题列表未加载）";
    sel.appendChild(o);
    return;
  }
  THEMES.forEach((theme) => {
    const o = document.createElement("option");
    o.value = theme.id;
    o.textContent = theme.name && theme.name !== theme.id ? theme.name + " · " + theme.id : theme.id;
    sel.appendChild(o);
  });
  if (current && current.theme) sel.value = current.theme;
}
function moveArticle(id, group){
  return rpc({ action: "update", id: id, group: group }).then(function (r) {
    toast(r && r.ok ? "已移动到 " + (group || "未分组") : "移动失败：" + ((r && r.error) || ""));
    if (r && r.ok) loadList();
  });
}

function makeRow(a){
  const row = document.createElement("div");
  row.className = "row";
  row.draggable = true;
  row.innerHTML = '<div class="rt"></div><div class="rm"><span></span><span></span></div>';
  row.querySelector(".rt").textContent = a.title || a.id;
  row.querySelectorAll(".rm span")[0].textContent = String(a.updatedAt || "").replace("T", " ");
  row.querySelectorAll(".rm span")[1].textContent = "第 " + (a.draftVersion || 0) + " 稿" + (a.author ? " · " + a.author : "");
  row.onclick = () => openArticle(a.id);
  row.addEventListener("dragstart", (e) => {
    row.classList.add("dragging");
    e.dataTransfer.setData("text/plain", a.id);
    e.dataTransfer.effectAllowed = "move";
  });
  row.addEventListener("dragend", () => row.classList.remove("dragging"));
  return row;
}

function dropTarget(node, group){
  node.addEventListener("dragover", (e) => { e.preventDefault(); node.classList.add("drop"); e.dataTransfer.dropEffect = "move"; });
  node.addEventListener("dragleave", () => node.classList.remove("drop"));
  node.addEventListener("drop", (e) => {
    e.preventDefault();
    node.classList.remove("drop");
    const id = e.dataTransfer.getData("text/plain");
    if (id) moveArticle(id, group);
  });
}

function renderRows(list){
  const box = $("rows");
  box.innerHTML = "";
  $("groupAll").style.display = viewGroup === null ? "none" : "";
  $("groupScope").textContent = viewGroup === null ? "" : "分组：" + (viewGroup || "未分组");
  const inView = list.filter((a) => viewGroup === null || String(a.group || "").trim() === viewGroup);
  if (!inView.length) {
    box.innerHTML = '<div class="empty">' + (viewGroup === null ? "还没有文章，先在上面新建一篇。" : "这个分组还没有文章，可在上方新建。") + "</div>";
    return;
  }
  if (viewGroup !== null) {
    inView.forEach((a) => box.appendChild(makeRow(a)));
    return;
  }
  const buckets = new Map();
  groups.forEach((name) => buckets.set(name, []));
  inView.forEach((a) => {
    const key = String(a.group || "").trim() || "未分组";
    if (!buckets.has(key)) buckets.set(key, []);
    buckets.get(key).push(a);
  });
  [...buckets.keys()].sort((left, right) => (left === "未分组" ? 1 : right === "未分组" ? -1 : left.localeCompare(right))).forEach((name) => {
    const title = document.createElement("div");
    title.className = "group-title";
    title.textContent = name + " · " + buckets.get(name).length + "  （点击进入 / 可拖入）";
    title.onclick = () => { viewGroup = name === "未分组" ? "" : name; renderRows(list); };
    dropTarget(title, name === "未分组" ? "" : name);
    box.appendChild(title);
    buckets.get(name).forEach((a) => box.appendChild(makeRow(a)));
  });
}
async function loadList(){
  const r = await rpc({ action: "list" });
  if (!r || !r.ok) { toast("读取失败：" + ((r && r.error) || "")); return; }
  groups = r.groups || [];
  renderRows(r.articles || []);
}
async function openArticle(id){
  // Drop the previous article's state first: a slow load must never leave the
  // old title, theme or proof on screen while another article is opening.
  current = null;
  $("title").textContent = "加载中…";
  $("state").textContent = "";
  $("detail").style.display = "flex";
  $("preview").removeAttribute("src");
  $("settingsView").classList.remove("on");
  $("newbar").style.display = "none";
  $("rows").style.display = "none";
  $("back").style.display = "";
  const r = await rpc({ action: "get", id: id });
  if (!r || !r.ok) { toast("打开失败：" + ((r && r.error) || "")); $("title").textContent = "打开失败"; return; }
  current = r.article;
  current.images = r.images || [];
  const title = current.title || current.id;
  $("title").textContent = title === current.id ? title : title + " · " + current.id;
  renderThemes();
  renderMetaFields(r);
  $("preview").src = previewUrl();
  updateState();
}

function renderMetaFields(r){
  $("fTitle").value = current.title || "";
  $("fAuthor").value = current.author || "";
  $("fGroup").value = current.group || "";
  $("authorList").innerHTML = (r.authors || []).map((name) => '<option value="' + name + '">').join("");
  $("groupList").innerHTML = (r.groups || []).map((name) => '<option value="' + name + '">').join("");
  const options = ['<option value="">不设封面</option>'].concat((current.images || []).map((image) => {
    const value = "images/" + image.name;
    return '<option value="' + value + '">' + image.name + "</option>";
  }));
  $("fCover").innerHTML = options.join("");
  $("fCover").value = current.cover || "";
}

function updateState(images){
  if (!current) return;
  const list = images || current.images || [];
  const count = list.length;
  const cover = current.cover ? "封面 ✓" : "未设封面";
  const author = current.author ? "作者 " + current.author : "未署名";
  const group = current.group ? "分组 " + current.group : "未分组";
  $("state").textContent = "第 " + (current.draftVersion || 0) + " 稿 · " + (current.theme || "") + " · 配图 " + count + " 张 · " + cover + " · " + author + " · " + group + (count < 3 ? "（不足 3 张，排版会被拦下）" : "");
}

async function saveMeta(field, value){
  if (!current || busy) return;
  setBusy(true);
  try {
    const r = await rpc({ action: "update", id: current.id, [field]: value });
    if (!r || !r.ok) { toast("保存失败：" + ((r && r.error) || "")); return; }
    current = Object.assign(current, r.article);
    const title = current.title || current.id;
    $("title").textContent = title === current.id ? title : title + " · " + current.id;
    updateState();
    loadList();
  } finally {
    setBusy(false);
  }
}
function showList(){
  current = null;
  // Returning from an article always lands on the full list; the group filter is
  // re-entered by clicking a group header.
  viewGroup = null;
  $("settingsView").classList.remove("on");
  $("detail").style.display = "none";
  $("newbar").style.display = "";
  $("rows").style.display = "";
  $("back").style.display = "none";
  $("title").textContent = "文章";
  loadList();
}
async function applyTheme(name){
  if (!current || busy) return;
  setBusy(true);
  try {
    const t = await rpc({ action: "theme", id: current.id, theme: name });
    if (!t || !t.ok) { toast("切换失败：" + ((t && t.error) || "")); return; }
    current.theme = name;
    renderThemes();
    updateState();
    const f = await rpc({ action: "format", id: current.id, theme: name });
    if (!f || !f.ok) { toast("排版失败：" + ((f && f.error) || "")); return; }
    $("preview").src = previewUrl();
    updateState();
    const missing = (f.warnings || []);
    toast(missing.length ? "已切换，但缺配图：" + missing.join("、") : "已切换风格：" + name);
  } finally {
    setBusy(false);
  }
}
async function runAction(body, okText){
  if (!current || busy) return;
  setBusy(true);
  try {
    const r = await rpc(body);
    const missing = (r && r.warnings) || [];
    toast(r && r.ok ? (missing.length ? okText + "，但缺配图：" + missing.join("、") : okText) : "失败：" + ((r && r.error) || "未知错误"));
    if (r && r.ok && body.action === "format") $("preview").src = previewUrl();
  } finally {
    setBusy(false);
  }
}
$("fTitle").onchange = () => saveMeta("title", $("fTitle").value.trim());
$("fAuthor").onchange = () => saveMeta("author", $("fAuthor").value.trim());
$("fGroup").onchange = () => saveMeta("group", $("fGroup").value.trim());
$("fCover").onchange = () => saveMeta("cover", $("fCover").value);
$("publish").onclick = () => runAction({ action: "publish", id: current.id }, "已推送草稿箱");
$("back").onclick = showList;
$("refresh").onclick = () => { if (current) openArticle(current.id); else loadList(); };
$("create").onclick = async () => {
  const title = $("newtitle").value.trim();
  if (!title) { toast("先写个标题"); return; }
  setBusy(true);
  try {
    const body = { action: "create", title };
    if (viewGroup !== null) body.group = viewGroup;
    const r = await rpc(body);
    if (r && r.ok) {
      $("newtitle").value = "";
      toast("已新建：" + title + (viewGroup ? "（" + (viewGroup || "未分组") + "）" : ""));
      await loadList();
      await openArticle(r.id);
    } else toast("新建失败：" + ((r && r.error) || ""));
  } finally { setBusy(false); }
};
$("newGroupBtn").onclick = () => {
  $("newGroupName").style.display = "";
  $("saveGroup").style.display = "";
  $("newGroupBtn").style.display = "none";
  $("newGroupName").focus();
};
$("saveGroup").onclick = async () => {
  const name = $("newGroupName").value.trim();
  if (!name) { toast("先写分组名"); return; }
  const r = await rpc({ action: "createGroup", name });
  toast(r && r.ok ? "已创建分组：" + name : "创建失败：" + ((r && r.error) || ""));
  if (!r || !r.ok) return;
  $("newGroupName").value = "";
  $("newGroupName").style.display = "none";
  $("saveGroup").style.display = "none";
  $("newGroupBtn").style.display = "";
  viewGroup = name;
  groups = r.groups || groups;
  loadList();
};
$("groupAll").onclick = () => { viewGroup = null; loadList(); };
$("newGroupName").addEventListener("keydown", (e) => { if (e.key === "Enter") $("saveGroup").click(); });
$("settingsBtn").onclick = async () => {
  const r = await rpc({ action: "settings" });
  if (!r || !r.ok) { toast("读取设置失败：" + ((r && r.error) || "")); return; }
  $("setRoot").value = r.root || "";
  $("setMinImages").value = r.minImages === undefined ? 3 : r.minImages;
  $("setTheme").innerHTML = THEMES.map((t) => '<option value="' + t.id + '">' + t.name + " · " + t.id + "</option>").join("");
  $("setTheme").value = r.defaultTheme || "newspaper";
  $("setAppId").value = r.wechat.app_id || "";
  $("setAppSecret").value = r.wechat.app_secret || "";
  $("setAuthor").value = r.wechat.author || "";
  $("settingsPath").textContent = "设置文件：" + (r.settingsPath || "") + "\n公众号配置：" + (r.configPath || "");
  $("rows").style.display = "none";
  $("newbar").style.display = "none";
  $("detail").style.display = "none";
  $("settingsView").classList.add("on");
};
$("closeSettings").onclick = () => {
  $("settingsView").classList.remove("on");
  if (current) openArticle(current.id);
  else { $("newbar").style.display = ""; $("rows").style.display = ""; loadList(); }
};
$("saveSettings").onclick = async () => {
  const r = await rpc({
    action: "saveSettings",
    root: $("setRoot").value.trim(),
    minImages: Number($("setMinImages").value),
    defaultTheme: $("setTheme").value,
    wechat: {
      app_id: $("setAppId").value.trim(),
      app_secret: $("setAppSecret").value,
      author: $("setAuthor").value.trim()
    }
  });
  toast(r && r.ok ? "设置已保存" : "保存失败：" + ((r && r.error) || ""));
  if (r && r.ok) loadList();
};
$("newtitle").addEventListener("keydown", (e) => { if (e.key === "Enter") $("create").click(); });
$("theme").addEventListener("change", (e) => { if (e.target.value) applyTheme(e.target.value); });
const params = new URLSearchParams(location.search);
const deepArticle = params.get("article");
checkHost();
loadThemes().then(() => {
  if (deepArticle) openArticle(deepArticle);
  else if (params.get("view") === "settings") $("settingsBtn").click();
  else loadList();
});
</script>
</body>
</html>
